<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안산시 시니어 AI 리터러시 진단 (AIL)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ansan: '#005BAC',     /* 안산시 상징색 */
                        bglight: '#F8F9FA',   /* 눈이 편한 연한 미색 */
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F8F9FA;
            font-family: 'Noto Sans KR', sans-serif;
            word-break: keep-all;
        }

        /* 시니어 맞춤 폰트 크기 기본 세팅 */
        .title-text {
            font-size: 32px;
            line-height: 1.4;
            font-weight: 700;
        }

        .body-text {
            font-size: 24px;
            line-height: 1.5;
        }

        .btn-text {
            font-size: 22px;
            font-weight: 500;
        }

        /* 페이드 인 애니메이션 */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="text-gray-900 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 1. 시작 화면 -->
    <div id="start-screen"
        class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-8 md:p-12 text-center fade-in border-t-8 border-ansan">
        <h1 class="title-text text-ansan mb-4">안산시 시니어<br>AI 리터러시 진단 (AIL)</h1>
        <p class="body-text text-gray-700 mb-8">나 실생활에서 인공지능(AI)을 얼마나 잘 이해하고 활용하고 있을까요?<br><br>나의 AI 이해도를 알아보고<br>나에게 딱
            맞는 평생학습관 맞춤형 교육을 추천받아 보세요!</p>
        <button onclick="startTest()"
            class="w-full bg-ansan hover:bg-blue-800 text-white rounded-xl py-6 px-6 btn-text transition-colors shadow-lg">
            진단 시작하기 (총 20문항)
        </button>
    </div>

    <!-- 2. 문항 화면 -->
    <div id="question-screen"
        class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-10 fade-in hidden border-t-8 border-ansan min-h-[500px] flex flex-col">
        <!-- 진행률 (Progress Bar) -->
        <div class="w-full bg-gray-200 rounded-full h-4 mb-3">
            <div id="progress-bar" class="bg-ansan h-4 rounded-full transition-all duration-300" style="width: 5%">
            </div>
        </div>
        <div class="text-right text-gray-500 mb-6 font-bold text-lg"><span id="q-num">1</span> / 20</div>

        <!-- 질문 텍스트 -->
        <h2 id="q-title" class="text-2xl font-bold text-ansan mb-2">[영역]</h2>
        <p id="q-text" class="title-text text-gray-800 mb-10 flex-grow">질문 내용이 여기에 들어갑니다.</p>

        <!-- 선택 버튼들 -->
        <div class="flex flex-col gap-3 w-full">
            <button onclick="selectAnswer(1)"
                class="w-full bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-ansan rounded-xl py-4 px-4 transition-colors text-gray-800 text-center break-keep flex items-center justify-center">
                <span class="text-lg md:text-xl font-medium">1. 전혀 그렇지 않다</span>
            </button>
            <button onclick="selectAnswer(2)"
                class="w-full bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-ansan rounded-xl py-4 px-4 transition-colors text-gray-800 text-center break-keep flex items-center justify-center">
                <span class="text-lg md:text-xl font-medium">2. 그렇지 않다</span>
            </button>
            <button onclick="selectAnswer(3)"
                class="w-full bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-ansan rounded-xl py-4 px-4 transition-colors text-gray-800 text-center break-keep flex items-center justify-center">
                <span class="text-lg md:text-xl font-medium">3. 보통이다</span>
            </button>
            <button onclick="selectAnswer(4)"
                class="w-full bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-ansan rounded-xl py-4 px-4 transition-colors text-gray-800 text-center break-keep flex items-center justify-center">
                <span class="text-lg md:text-xl font-medium">4. 그렇다</span>
            </button>
            <button onclick="selectAnswer(5)"
                class="w-full bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-ansan rounded-xl py-4 px-4 transition-colors text-gray-800 text-center break-keep flex items-center justify-center">
                <span class="text-lg md:text-xl font-medium">5. 매우 그렇다</span>
            </button>
        </div>

        <!-- 이전 문항으로 가기 (첫 질문에서는 숨김) -->
        <div class="mt-6 text-center hidden" id="prev-btn-container">
            <button onclick="prevQuestion()" class="text-gray-500 text-xl underline p-3 hover:text-ansan">이전 문항으로
                돌아가기</button>
        </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen"
        class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-10 fade-in hidden border-t-8 border-ansan">
        <h1 class="title-text text-ansan text-center mb-6">나의 진단 결과</h1>

        <!-- 등급 표시 -->
        <div class="bg-blue-50 border-2 border-blue-100 rounded-xl p-8 mb-8 text-center shadow-inner">
            <p class="text-2xl text-gray-600 mb-2">당신의 AI 리터러시 등급은</p>
            <h2 id="result-grade" class="text-5xl font-bold text-ansan mb-6">[AI 마스터]</h2>
            <p id="result-desc" class="body-text text-gray-800 font-bold mb-4">설명 텍스트</p>
            <div class="inline-block bg-white px-6 py-2 rounded-full shadow border border-gray-200">
                <p id="result-score" class="text-2xl font-bold text-gray-700">총점: 0점</p>
            </div>
        </div>

        <!-- 레이더 차트 영역 -->
        <div class="mb-8 p-4 bg-white border-2 border-gray-100 rounded-xl shadow-sm">
            <canvas id="radarChart"></canvas>
        </div>

        <!-- 취약점 조언 영역 -->
        <div class="bg-yellow-50 border-2 border-yellow-200 rounded-xl p-8 mb-8 shadow-sm">
            <h3 class="text-2xl font-bold text-yellow-800 mb-3 flex items-center">
                <span class="text-3xl mr-2">💡</span> 영역별 맞춤형 조언
            </h3>
            <p id="result-advice" class="body-text text-gray-800">가장 점수가 낮은 영역에 대한 조언</p>
        </div>

        <!-- 하단 액션 버튼들 -->
        <div class="flex flex-col space-y-4">
            <a href="https://lll.ansan.go.kr" target="_blank"
                class="block w-full text-center bg-ansan hover:bg-blue-800 text-white rounded-xl py-6 px-6 btn-text transition-colors shadow-lg">
                안산시 평생학습관 교육 신청하기
            </a>
            <button onclick="shareKakao()"
                class="w-full bg-[#FEE500] hover:bg-[#E5CF00] text-[#000000] rounded-xl py-6 px-6 btn-text transition-colors shadow-md flex justify-center items-center">
                <!-- 카카오톡 아이콘 SVG -->
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="mr-3">
                    <path
                        d="M12 3C6.477 3 2 6.559 2 10.954c0 2.81 1.954 5.275 4.935 6.645-.224.846-.81 3.036-.84 3.167-.093.42.148.406.31.29 1.254-.91 4.382-3.21 4.382-3.21.398.056.808.085 1.223.085 5.523 0 10-3.554 10-7.949C22 6.559 17.523 3 12 3z" />
                </svg>
                카카오톡으로 결과 공유하기
            </button>
            <button onclick="location.reload()"
                class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl py-5 px-6 btn-text transition-colors mt-2">
                처음부터 다시 검사하기
            </button>
        </div>
    </div>

    <!-- JavaScript Data & Logic -->
    <script>
        const questions = [
            // 1. AI 지식
            { section: "AI 지식", text: "1. 인공지능(AI)의 원리를 안다. " },
            { section: "AI 지식", text: "2. 인공지능과 일반 검색 서비스(네이버 등)의 차이점을 알고 있다." },
            { section: "AI 지식", text: "3. 인공지능이 때로는 틀린 정보를 진짜처럼 말할 수 있다는 사실을 알고 있다." },
            { section: "AI 지식", text: "4. 내 스마트폰 앱들 속에 이미 인공지능 기술이 들어있음을 인지한다." },

            // 2. AI 활용
            { section: "AI 활용", text: "5. 스마트폰 음성 비서(빅스비, 시리 등)를 일상에서 사용한다." },
            { section: "AI 활용", text: "6. 챗GPT같은 AI에게 궁금한 것을 물어보고 답을 얻을 수 있다." },
            { section: "AI 활용", text: "7. 번역 앱이나 길 찾기 앱을 혼자서 충분히 조작할 수 있다." },
            { section: "AI 활용", text: "8. AI를 이용해 사진을 꾸미거나 영상을 만들어보고 싶다." },

            // 3. 비판적 사고
            { section: "비판적 사고", text: "9. 인터넷 뉴스가 AI가 만든 가짜 뉴스인지 의심해 본 적이 있다." },
            { section: "비판적 사고", text: "10. 유튜브 등의 영상 추천이 내 과거 기록을 분석한 AI의 결과임을 안다." },
            { section: "비판적 사고", text: "11. AI의 답변이 특정 방향으로 편향되거나 차별적일 수 있음을 인지한다." },
            { section: "비판적 사고", text: "12. AI가 알려준 정보의 사실 여부를 주변이나 다른 곳에서 확인하려 노력한다." },

            // 4. 윤리/보안
            { section: "윤리/보안", text: "13. AI 서비스에 내 개인정보나 비밀번호를 입력할 때 주의해야 함을 알고 있다." },
            { section: "윤리/보안", text: "14. AI가 만든 그림이나 글에도 저작권 문제가 있을 수 있음을 알고 있다." },
            { section: "윤리/보안", text: "15. AI 기술을 악용한 신종 보이스피싱 수법에 대해 들어본 적이 있다." },
            { section: "윤리/보안", text: "16. AI 기술이 앞으로 사람들의 일자리에 영향을 줄 수 있음을 알고 있다." },

            // 5. 태도/학습
            { section: "태도/학습", text: "17. AI 기술을 조금 더 배우면 내 삶이 훨씬 편리해질 것이라 생각한다." },
            { section: "태도/학습", text: "18. 새로운 AI 나 기계가 나오면 거부감보다는 호기심이 생긴다." },
            { section: "태도/학습", text: "19. 안산시 평생학습관에서 열리는 AI 교육에 참여할 생각이 있다." },
            { section: "태도/학습", text: "20. 내가 배운 AI 활용법을 주변 친구나 가족에게 알려주고 싶다." }
        ];

        let currentQ = 0;
        let answers = new Array(20).fill(0);
        let myChart = null;

        function startTest() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            window.scrollTo(0, 0);
            showQuestion();
        }

        function showQuestion() {
            // UI 업데이트
            document.getElementById('q-num').innerText = currentQ + 1;
            document.getElementById('q-title').innerText = `[${questions[currentQ].section}]`;
            document.getElementById('q-text').innerText = questions[currentQ].text;

            // 프로그레스 바 계산
            const progress = ((currentQ) / 20) * 100;
            document.getElementById('progress-bar').style.width = Math.max(progress, 5) + '%';

            // 이전 버튼 보이기/숨기기
            if (currentQ > 0) {
                document.getElementById('prev-btn-container').classList.remove('hidden');
            } else {
                document.getElementById('prev-btn-container').classList.add('hidden');
            }
            // 스크롤 상단 이동 (화면이 작을 때 다음 문항 보기에 용이하도록)
            window.scrollTo(0, 0);
        }

        function selectAnswer(score) {
            answers[currentQ] = score;
            if (currentQ < 19) {
                currentQ++;
                showQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentQ > 0) {
                currentQ--;
                showQuestion();
            }
        }

        function showResult() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            window.scrollTo(0, 0);

            // 영역별 점수 합산
            let scores = {
                "AI 지식": 0,
                "AI 활용": 0,
                "비판적 사고": 0,
                "윤리/보안": 0,
                "태도/학습": 0
            };

            for (let i = 0; i < 4; i++) scores["AI 지식"] += answers[i];
            for (let i = 4; i < 8; i++) scores["AI 활용"] += answers[i];
            for (let i = 8; i < 12; i++) scores["비판적 사고"] += answers[i];
            for (let i = 12; i < 16; i++) scores["윤리/보안"] += answers[i];
            for (let i = 16; i < 20; i++) scores["태도/학습"] += answers[i];

            let totalScore = Object.values(scores).reduce((a, b) => a + b, 0); // 20~100점 범위

            // 등급 판정 로직
            let grade, desc;
            if (totalScore >= 85) {
                grade = "AI 마스터";
                desc = "이미 안산의 디지털 리더이시군요!\n'AI 강사 양성 과정'을 통해 재능 나눔에 도전해 보세요.";
            } else if (totalScore >= 60) {
                grade = "AI 활용가";
                desc = "기술 활용 능력이 뛰어납니다.\n'생성형 AI로 나만의 콘텐츠 만들기' 수업을 추천합니다.";
            } else if (totalScore >= 40) {
                grade = "AI 탐험가";
                desc = "AI와 친해질 준비가 되셨네요.\n'챗GPT로 즐기는 스마트 생활' 강의가 딱입니다.";
            } else {
                grade = "AI 입문자";
                desc = "걱정 마세요!\n'대학생과 함께 배우는 시니어 AI' 교육이 여러분을 기다립니다.";
            }

            document.getElementById('result-grade').innerText = `[${grade}]`;
            // 줄바꿈 반영
            document.getElementById('result-desc').innerHTML = desc.replace(/\n/g, '<br>');
            document.getElementById('result-score').innerText = `총점: ${totalScore}점 (100점 만점)`;

            // 가장 낮은 취약 영역 찾기
            let minArea = Object.keys(scores).reduce((a, b) => scores[a] <= scores[b] ? a : b);

            // 영역별 맞춤 코멘트
            let advice = "";
            if (minArea === "AI 지식") {
                advice = "AI 기술의 기본 원리나 자주 쓰이는 용어를 조금 더 알아가시면, 실생활 활용이 훨씬 쉬워질 거예요.";
            } else if (minArea === "AI 활용") {
                advice = "지식은 충분하시네요! 이제 스마트폰을 꺼내 직접 음성 비서나 챗GPT를 한 번씩 눌러보고 체험해 보세요.";
            } else if (minArea === "비판적 사고") {
                advice = "AI가 주는 정보나 영상이 항상 100% 정답은 아닐 수 있습니다. 한 번쯤 진짜인지 의심해보고 확인하는 습관을 가져보세요.";
            } else if (minArea === "윤리/보안") {
                advice = "편리함만큼 중요한 것이 '안전'입니다. 개인정보 보호 방법과 진화하는 AI 보이스피싱 예방 교육을 들어보시길 강력히 권장합니다.";
            } else if (minArea === "태도/학습") {
                advice = "AI는 멀고 어려운 기계가 아니라, 나를 돕는 똑똑한 비서입니다. 조금 더 열린 마음과 호기심을 가져보시면 어떨까요?";
            }

            document.getElementById('result-advice').innerHTML = `현재 <strong>'${minArea}'</strong> 영역의 점수가 다른 곳에 비해 조금 낮습니다.<br><br>${advice}`;

            // 차트 렌더링
            drawChart(scores);
        }

        function drawChart(scores) {
            const ctx = document.getElementById('radarChart').getContext('2d');

            if (myChart) myChart.destroy(); // 기존 차트가 있으면 삭제 후 다시 생성

            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: Object.keys(scores),
                    datasets: [{
                        label: '나의 AI 역량 점수',
                        data: Object.values(scores),
                        backgroundColor: 'rgba(0, 91, 172, 0.25)', // 안산 블루 반투명
                        borderColor: '#005BAC',
                        pointBackgroundColor: '#005BAC',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#005BAC',
                        borderWidth: 3,
                        pointRadius: 5,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(0,0,0,0.1)' },
                            grid: { color: 'rgba(0,0,0,0.1)' },
                            pointLabels: {
                                font: {
                                    size: 16,
                                    family: "'Noto Sans KR', sans-serif",
                                    weight: 'bold'
                                },
                                color: '#1B263B'
                            },
                            ticks: {
                                beginAtZero: true,
                                max: 20,       // 각 영역당 만점 20점
                                stepSize: 5,
                                display: false // 깔끔함을 위해 눈금 숫자 숨김
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }, // 범례 숨김
                        tooltip: {
                            titleFont: { size: 16 },
                            bodyFont: { size: 16 },
                            padding: 10
                        }
                    }
                }
            });
        }

        function shareKakao() {
            const totalScore = answers.reduce((a, b) => a + b, 0);
            const url = window.location.href;
            const text = `🎉 나의 AI 리터러시 점수는? [${totalScore}점]\n\n안산시 시니어 AI 리터러시 진단을 통해 실생활 AI 활용 능력을 확인하고, 나에게 딱 맞는 평생학습관 교육을 추천받아 보세요!`;

            // 모바일 기기에서의 네이티브 공유 API 지원 시
            if (navigator.share) {
                navigator.share({
                    title: '안산시 AI 리터러시 진단 (AIL)',
                    text: text,
                    url: url
                }).catch((error) => console.log('공유 실패 또는 취소', error));
            } else {
                // PC 등 지원하지 않는 환경에서는 클립보드 복사 유도
                alert("URL이 복사되었습니다. 카카오톡 등 원하는 곳에 붙여넣기(Ctrl+V)하여 공유해주세요!");
                navigator.clipboard.writeText(`${text}\n${url}`);
            }
        }
    </script>
</body>

</html>
